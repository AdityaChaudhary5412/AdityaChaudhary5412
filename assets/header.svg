<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');

      :root {
        --bg-void: #070913;
        --grid-line: rgba(0, 240, 255, 0.05);
        --neon-cyan: #00f0ff;
        --neon-pink: #ff0055;
        --neon-purple: #9d4edd;
        --text-main: #f8fafc;
        --text-dim: #64748b;
        --hud-border: #1e293b;
      }

      .hud-card {
        fill: #060913;
        stroke: #1e293b;
        stroke-width: 1.5;
        rx: 8px;
      }

      .grid-pattern {
        stroke: var(--grid-line);
        stroke-width: 0.75;
      }

      .text-glitch {
        font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
        font-size: 27px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 2px;
      }

      .text-sub {
        font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #00f0ff;
        letter-spacing: 1.5px;
      }

      .text-hud {
        font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
        font-size: 10px;
        font-weight: 700;
        fill: #94a3b8;
        letter-spacing: 1px;
      }

      .corner-bracket {
        stroke: #00f0ff;
        stroke-width: 2.5;
        stroke-linecap: square;
      }

      /* Animated Neon Border Runner */
      .laser-tracer {
        stroke: url(#neon-tracer-grad);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 120 700;
        animation: traceBorder 5s linear infinite;
      }

      @keyframes traceBorder {
        0% { stroke-dashoffset: 820; }
        100% { stroke-dashoffset: -820; }
      }

      /* Pulsing Radar Dot */
      .status-pulse {
        animation: radarPing 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      @keyframes radarPing {
        0% { r: 3.5; opacity: 1; stroke: #00f0ff; stroke-width: 1; fill: none; }
        60%, 100% { r: 10; opacity: 0; stroke: #00f0ff; stroke-width: 0.5; fill: none; }
      }

      /* Ambient Glow Line */
      .glow-line {
        stroke: url(#cyan-glow);
        stroke-width: 1.5;
      }
    </style>

    <!-- Neon Tracer Gradient -->
    <linearGradient id="neon-tracer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="75%" stop-color="#ff0055" stop-opacity="1" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff0055" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Background Matrix Grid Pattern -->
    <pattern id="matrix-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-pattern" />
    </pattern>
  </defs>

  <!-- Background with Matrix Grid -->
  <rect x="1" y="1" width="848" height="158" class="hud-card" />
  <rect x="2" y="2" width="846" height="156" rx="8" fill="url(#matrix-grid)" />

  <!-- Animated Neon Perimeter Tracer -->
  <rect x="1" y="1" width="848" height="158" rx="8" fill="none" class="laser-tracer" />

  <!-- Cyberpunk Corner HUD Brackets -->
  <!-- Top Left -->
  <path d="M 12 28 L 12 12 L 28 12" class="corner-bracket" fill="none" />
  <!-- Top Right -->
  <path d="M 822 12 L 838 12 L 838 28" class="corner-bracket" fill="none" />
  <!-- Bottom Left -->
  <path d="M 12 132 L 12 148 L 28 148" class="corner-bracket" fill="none" />
  <!-- Bottom Right -->
  <path d="M 822 148 L 838 148 L 838 132" class="corner-bracket" fill="none" />

  <!-- Top System Telemetry Bar -->
  <g transform="translate(36, 30)">
    <text x="0" y="0" class="text-hud">// SYS.ID: ADITYA_5412</text>
    <text x="180" y="0" class="text-hud">LOC: IN_DELHI</text>
    <text x="310" y="0" class="text-hud">SYS: ONLINE [144 FPS]</text>
  </g>

  <!-- Title & Callout -->
  <g transform="translate(36, 75)">
    <text x="0" y="0" class="text-glitch">ADITYA CHAUDHARY</text>
    <text x="0" y="28" class="text-sub">> FULL-STACK DEVELOPER // SYSTEMS &amp; AI ENGINEER</text>
  </g>

  <!-- Gamer HUD Status Pill -->
  <g transform="translate(640, 52)">
    <rect width="170" height="34" rx="4" fill="#0d1424" stroke="#00f0ff" stroke-width="1.2" />
    <circle cx="20" cy="17" r="4" fill="#00f0ff" />
    <circle cx="20" cy="17" r="4" class="status-pulse" />
    <text x="34" y="21" class="text-hud" fill="#ffffff">RANK: LEVEL 20</text>
  </g>

  <!-- Bottom Glowing Divider Line -->
  <line x1="36" y1="124" x2="814" y2="124" class="glow-line" />

  <!-- Crosshair Accents -->
  <g transform="translate(814, 124)" stroke="#ff0055" stroke-width="1">
    <line x1="-5" y1="0" x2="5" y2="0" />
    <line x1="0" y1="-5" x2="0" y2="5" />
  </g>
</svg>
