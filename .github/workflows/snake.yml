name: Generate Contribution Snake

on:
  schedule:
    # Run once daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake SVGs (Custom Modern Theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2563eb&color_dots=#ebedf0,#bfdbfe,#60a5fa,#2563eb,#1d4ed8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#60a5fa&color_dots=#161b22,#1e3a8a,#2563eb,#3b82f6,#93c5fd

      - name: Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
